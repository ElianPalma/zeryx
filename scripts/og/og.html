<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:Inter;font-weight:100 900;src:url(../../public/fonts/inter-latin-wght-normal.woff2) format('woff2-variations')}
@font-face{font-family:Inter;font-weight:100 900;src:url(../../public/fonts/inter-latin-ext-wght-normal.woff2) format('woff2-variations');unicode-range:U+0100-02BA,U+1E00-1E9F}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{position:relative;font-family:Inter,sans-serif;background:#ffffff;color:#0f172a;-webkit-font-smoothing:antialiased}
.b{position:absolute;border-radius:50%;filter:blur(90px)}
.wrap{position:absolute;inset:0;padding:72px 80px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:14px;font-weight:700;font-size:34px;letter-spacing:-.02em}
.tag{align-self:flex-start;margin-top:auto;font-size:22px;font-weight:600;padding:8px 18px;border-radius:999px;background:#7c3aed;color:#fff}
.tag.soon{background:#fef3c7;color:#b45309}
h1{margin:22px 0 0;font-size:76px;line-height:1;letter-spacing:-.045em;font-weight:700;max-width:1000px;text-wrap:balance}
h1 span{color:#7c3aed}
p{margin:24px 0 0;font-size:28px;color:#475569;letter-spacing:-.01em;max-width:960px}
.url{position:absolute;right:80px;top:84px;font-size:24px;font-weight:600;color:#7c3aed}
</style>
</head>
<body>
<div class="b" style="width:620px;height:620px;right:-160px;top:-220px;background:#bc95ff;opacity:.55"></div>
<div class="b" style="width:520px;height:520px;right:120px;bottom:-320px;background:#7c3aed;opacity:.35"></div>
<div class="wrap">
  <div class="brand"><img src="../../public/logo-zeryx.svg" width="44" height="44" alt="">zeryx</div>
  <div class="tag" id="tag"></div>
  <h1 id="t"></h1>
  <p id="s"></p>
</div>
<div class="url">zeryx.io</div>
<script>
const q = new URLSearchParams(location.search)
const tag = document.getElementById('tag')
if (q.get('k')) { tag.textContent = q.get('k'); if (q.get('soon')) tag.className = 'tag soon' } else tag.remove()
const t = q.get('t') || 'Tú vendes.|Zeryx cobra.'
const [a, b] = t.split('|')
document.getElementById('t').innerHTML = ''
document.getElementById('t').append(a)
if (b) { const sp = document.createElement('span'); sp.textContent = b; document.getElementById('t').append(document.createElement('br'), sp) }
document.getElementById('s').textContent = q.get('s') || 'Tu departamento de cobro, sin contratar a nadie'
if (!q.get('k')) document.querySelector('h1').style.marginTop = 'auto'
</script>
</body>
</html>
